[build]
  publish = "dist"
  command = "npm run build"

# Redirects for pages that exist on the old site but not on the new one.

# Garden room type pages without dedicated pages yet
[[redirects]]
  from = "/garden-rooms/garden-bar"
  to = "/garden-rooms/bespoke"
  status = 301

[[redirects]]
  from = "/garden-rooms/garden-rooms-inner"
  to = "/garden-rooms/garden-rooms"
  status = 301

[[redirects]]
  from = "/recycle-bin/garden-studios"
  to = "/garden-rooms/garden-rooms"
  status = 301

# Other missing pages
[[redirects]]
  from = "/finance"
  to = "/our-prices"
  status = 301


[[redirects]]
  from = "/site-survey"
  to = "/contact-us"
  status = 301

# Redirect old Soro ?post=slug URLs to new native blog post pages
[[redirects]]
  from = "/news"
  to = "/news/:post"
  status = 301
  [redirects.query]
    post = ":post"
